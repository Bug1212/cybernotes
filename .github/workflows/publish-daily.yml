name: Publish daily article

# Once a day at 03:30 UTC (09:00 IST): publish at most ONE AI article that passed
# the fact-check and the quality gate. Failed drafts go to /admin/review instead.
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_URL: ${{ secrets.SITE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Check secrets are set
        run: |
          [ -n "$SITE_URL" ] || { echo "::error::Repository secret SITE_URL is empty or missing (Settings > Secrets and variables > Actions > Secrets)"; exit 1; }
          [ -n "$CRON_SECRET" ] || { echo "::error::Repository secret CRON_SECRET is empty or missing"; exit 1; }
          case "$SITE_URL" in https://*|http://*) ;; *) echo "::error::SITE_URL must start with https://"; exit 1;; esac
      - name: Publish
        run: |
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 15 --max-time 60 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "${SITE_URL%/}/api/pipeline/publish"
