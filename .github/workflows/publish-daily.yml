name: Publish daily article

# Once a day at 03:30 UTC (09:00 IST): publish at most ONE AI article that passed
# the fact-check and the quality gate. Failed drafts go to /admin/review instead.
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish
        run: |
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 15 --max-time 60 \
            -X POST -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/pipeline/publish"