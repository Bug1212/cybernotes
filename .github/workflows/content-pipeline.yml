name: Content pipeline (fetch + draft)

# Every 6 hours: pull new items from the RSS sources, then draft up to 2 articles with Groq.
# Drafts wait until the daily publish workflow picks the best one that passes the quality gate.
on:
  schedule:
    - cron: "15 */6 * * *"   # minute 15 of every 6th hour (UTC)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_URL: ${{ secrets.SITE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Check secrets are set
        run: |
          [ -n "$SITE_URL" ] || { echo "::error::Repository secret SITE_URL is empty or missing (Settings > Secrets and variables > Actions > Secrets)"; exit 1; }
          [ -n "$CRON_SECRET" ] || { echo "::error::Repository secret CRON_SECRET is empty or missing"; exit 1; }
          case "$SITE_URL" in https://*|http://*) ;; *) echo "::error::SITE_URL must start with https://"; exit 1;; esac
      - name: Fetch sources
        run: |
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 15 --max-time 120 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "${SITE_URL%/}/api/pipeline/fetch"
      - name: Draft articles
        run: |
          curl --fail-with-body --silent --show-error --retry 2 --retry-delay 20 --max-time 120 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "${SITE_URL%/}/api/pipeline/generate?count=2"
