name: Sync CVEs

# Twice a day: add new CVEs from CISA's Known Exploited Vulnerabilities catalog and NIST NVD.
on:
  schedule:
    - cron: "20 4,16 * * *"
  workflow_dispatch:

jobs:
  cves:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_URL: ${{ secrets.SITE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Check secrets are set
        run: |
          [ -n "$SITE_URL" ] || { echo "::error::Repository secret SITE_URL is empty or missing (Settings > Secrets and variables > Actions > Secrets)"; exit 1; }
          [ -n "$CRON_SECRET" ] || { echo "::error::Repository secret CRON_SECRET is empty or missing"; exit 1; }
          case "$SITE_URL" in https://*|http://*) ;; *) echo "::error::SITE_URL must start with https://"; exit 1;; esac
      - name: Sync CVEs
        run: |
          curl --fail-with-body --silent --show-error --retry 2 --retry-delay 30 --max-time 90 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "${SITE_URL%/}/api/pipeline/cves"
